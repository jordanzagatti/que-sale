name: Ingesta experimental (staging)

on:
  workflow_dispatch:
    inputs:
      source:
        description: "IDs separados por coma: alternativa,ticketek,timeout,plateanet"
        required: false
        default: ""
      limit:
        description: "Máximo de eventos por fuente"
        required: false
        default: "40"

concurrency:
  group: ingest-experimental
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ingesta experimental
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          GCBA_RESOURCE_ID: ${{ secrets.GCBA_RESOURCE_ID }}
        run: |
          args="--mode=experimental --limit=${{ inputs.limit || '40' }}"
          if [ -n "${{ inputs.source }}" ]; then
            args="$args --source=${{ inputs.source }}"
          fi
          npm run ingest -- $args

      - name: Recordatorio de revisión
        run: |
          echo "Los eventos quedaron en events_staging (status=pending)."
          echo "No se publican hasta correr: npm run promote -- --source=<id>"
