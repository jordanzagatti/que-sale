<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090b" />
    <title>Sin conexión · ¿Qué Sale?</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #09090b;
        background-image: radial-gradient(ellipse 80% 50% at 50% -20%, rgb(124 58 237 / 0.25), transparent);
        color: #fafafa;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        padding: 24px;
      }
      main {
        max-width: 420px;
        text-align: center;
        padding: 40px 28px;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 28px;
        background: rgba(24,24,27,0.65);
        backdrop-filter: blur(20px);
      }
      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: linear-gradient(135deg, #7c3aed, #d946ef);
        font-weight: 700;
        letter-spacing: -1px;
        font-size: 20px;
      }
      h1 { margin: 0; font-size: 24px; letter-spacing: -0.03em; }
      p { margin: 12px 0 0; color: #a1a1aa; font-size: 14px; line-height: 1.7; }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 24px;
        height: 44px;
        padding: 0 24px;
        border-radius: 999px;
        background: #8b5cf6;
        color: white;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">QS</div>
      <h1>Estás sin conexión</h1>
      <p>
        No pudimos cargar la agenda porque no hay internet. Cuando vuelvas a
        conectarte, los eventos se actualizan solos.
      </p>
      <a href="/">Reintentar</a>
    </main>
  </body>
</html>
